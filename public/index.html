<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio RX</title>
</head>
<body>

    <!-- LOGIN -->

    <div id="login">

        <h1>Laboratorio RX</h1>

        <h2>Ingresar al chat</h2>

        <input
            id="txtNombre"
            type="text"
            placeholder="Ingrese su nombre"
        >

        <button id="btnIngresar">
            Entrar
        </button>

    </div>

    <!-- CHAT -->

    <div id="chat" style="display:none;">

        <h2>Reloj</h2>

        <p id="reloj">
            Esperando hora...
        </p>

        <hr>

        <h2>Usuarios conectados</h2>

        <ul id="usuarios"></ul>

        <hr>

        <h2>Mensajes</h2>

        <ul id="mensajes"></ul>

        <input
            id="txtMensaje"
            type="text"
            placeholder="Escriba un mensaje"
        >

        <button id="btnEnviar">
            Enviar
        </button>

    </div>

    <script src="https://unpkg.com/rxjs@7/dist/bundles/rxjs.umd.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="cliente.js"></script>

</body>
</html>
