<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio RX</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="cabecera">
        <h1>Laboratorio de Programacion Distribuida</h1>
        <p class="subtitulo">Davor Kissner y Nicolás Jazcnik</p>
    </header>

    <main class="contenedor">

        <!-- LOGIN -->
        <section id="login" class="tarjeta">

            <h2>Ingresar al chat</h2>

            <div class="fila">
                <input
                    id="txtNombre"
                    type="text"
                    placeholder="Ingrese su nombre"
                >
                <button id="btnIngresar">Entrar</button>
            </div>

        </section>

        <!-- CHAT -->
        <section id="chat" class="grilla" style="display:none;">

            <aside class="columna-lateral">

                <div class="tarjeta">
                    <h2>Reloj</h2>
                    <p id="reloj" class="reloj">Esperando hora...</p>
                </div>

                <div class="tarjeta tarjeta-anuncio">
                    <h2>Anuncios</h2>
                    <p id="anuncio">Cargando anuncios...</p>
                </div>

                <div class="tarjeta">
                    <h2>Usuarios conectados</h2>
                    <ul id="usuarios" class="lista-usuarios"></ul>
                </div>

            </aside>

            <div class="tarjeta columna-chat">

                <h2>Mensajes</h2>

                <ul id="mensajes" class="lista-mensajes"></ul>

                <div class="fila">
                    <input
                        id="txtMensaje"
                        type="text"
                        placeholder="Escriba un mensaje"
                    >
                    <button id="btnEnviar">Enviar</button>
                </div>

            </div>

        </section>

    </main>

    <script src="https://unpkg.com/rxjs@7/dist/bundles/rxjs.umd.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="cliente.js"></script>

</body>
</html>
